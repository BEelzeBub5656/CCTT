name: cctt
description: Offline-first inventory management app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 本地数据层
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  path: ^1.9.1
  path_provider: ^2.1.5

  # 身份识别
  uuid: ^4.5.1

  # AI / OCR 录入层
  camera: ^0.11.1
  image_picker: ^1.1.2

  # 网络同步层 (MQTT)
  mqtt_client: ^10.11.11

  # 状态管理
  flutter_bloc: ^9.1.0
  bloc: ^9.0.1

  # 依赖注入
  get_it: ^8.0.3
  injectable: ^2.5.0

  # 不可变数据 / JSON 序列化
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 通用工具
  intl: ^0.20.2
  permission_handler: ^11.4.0
  equatable: ^2.0.7

  # 本地配置持久化
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
