name: cctt
description: Cloud-connected inventory management app
publish_to: 'none'
version: 0.1.4+2005

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 本地数据层
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # 身份识别
  uuid: ^4.5.1

  # 照片留档
  camera: ^0.11.1
  image_picker: ^1.1.2

  # 网络层
  mqtt_client: ^10.11.11  # MQTT 同步
  http: ^1.2.2            # HTTP (OCR 上传)

  # 文件分享和选择
  share_plus: ^10.1.3     # 文件分享
  file_picker: ^8.1.6     # 文件选择器

  # 状态管理
  flutter_bloc: ^9.1.0
  bloc: ^9.0.1

  # 依赖注入
  get_it: ^8.0.3
  injectable: ^2.5.0

  # 不可变数据 / JSON 序列化
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 通用工具
  intl: ^0.20.2
  permission_handler: ^11.4.0
  equatable: ^2.0.7
  package_info_plus: ^8.3.1  # 获取APP版本信息
  open_file: ^3.5.10         # 打开APK文件进行安装

  # 本地配置持久化
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 仅供桌面数据库单元测试使用，不打入手机 APK
  sqflite_common_ffi: ^2.3.5
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

# 桌面测试使用系统 SQLite；Android 正式数据库仍由 sqflite 插件提供。
hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3
      name_android: sqlite
      name_windows: winsqlite3
