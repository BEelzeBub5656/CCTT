name: Build Release APK

on:
  # 手动触发（去 GitHub Actions 页面点 Run workflow）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v2.0.1）'
        required: false
        default: ''

  # 推送到 main / tag 时自动构建
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'admin/**'
      - '.gitignore'

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: ☕ 安装 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: 📦 安装依赖
        run: flutter pub get

      - name: 🔨 构建 Release APK
        run: flutter build apk --release --split-per-abi

      - name: 📱 上传 APK（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: CCTT-APKs
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: 🚀 创建 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CCTT ${{ github.ref_name }}
          body: |
            ## 📱 CCTT ${{ github.ref_name }}

            ### 安装说明
            - **arm64-v8a**：适用于大多数现代手机
            - **armeabi-v7a**：适用于较旧的 32 位设备
            - **x86_64**：适用于模拟器

            下载对应架构的 APK 安装即可。

            ### ⚠️ 注意
            首次安装可能需要允许「未知来源」应用安装。
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
