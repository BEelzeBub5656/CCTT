name: Build Release APK

on:
  # 手动触发（去 GitHub Actions 页面点 Run workflow）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v2.0.1）'
        required: false
        default: ''

  # 推送到 main / tag 时自动构建
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'admin/**'
      - '.gitignore'

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: ☕ 安装 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: 🔐 配置 Android 固定签名
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_SIGNING_KEY_BASE64"
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > android/app/cctt-release.jks
          printf 'storeFile=cctt-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > android/key.properties

      - name: 📦 安装依赖
        run: flutter pub get

      - name: 🔨 构建 Release APK
        run: flutter build apk --release

      - name: 📱 上传 APK（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: CCTT-APKs
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 🚀 创建 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CCTT ${{ github.ref_name }}
          body: |
            ## 📱 CCTT ${{ github.ref_name }}

            ### 安装说明
            下载通用 APK 安装即可。

            ### ⚠️ 注意
            首次安装可能需要允许「未知来源」应用安装。
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
